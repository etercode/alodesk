<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'" />
		<title>Share your screen</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, sans-serif;
				background: #1e1f22;
				color: #f2f3f5;
			}
			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				margin: 0;
			}
			h1 {
				margin: 0;
				padding: 18px 20px 6px;
				font-size: 18px;
			}
			nav {
				display: flex;
				gap: 6px;
				padding: 8px 20px;
			}
			nav button {
				padding: 6px 14px;
				border: 0;
				border-radius: 8px;
				background: transparent;
				color: #b5bac1;
				font: inherit;
				cursor: pointer;
			}
			nav button[aria-pressed='true'] {
				background: #3f4147;
				color: #fff;
			}
			main {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
				gap: 12px;
				flex: 1;
				overflow-y: auto;
				padding: 8px 20px;
				align-content: start;
			}
			main button {
				display: grid;
				gap: 6px;
				padding: 8px;
				border: 2px solid transparent;
				border-radius: 10px;
				background: #2b2d31;
				color: inherit;
				font: inherit;
				text-align: left;
				cursor: pointer;
			}
			main button:hover {
				background: #35373c;
			}
			main button[aria-pressed='true'] {
				border-color: #5865f2;
			}
			main img {
				width: 100%;
				aspect-ratio: 16 / 9;
				object-fit: contain;
				border-radius: 6px;
				background: #111214;
			}
			main span {
				overflow: hidden;
				font-size: 13px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			footer {
				display: flex;
				justify-content: flex-end;
				gap: 10px;
				padding: 14px 20px;
				background: #2b2d31;
			}
			footer button {
				padding: 9px 18px;
				border: 0;
				border-radius: 8px;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			#cancel {
				background: transparent;
				color: #f2f3f5;
			}
			#share {
				background: #5865f2;
				color: #fff;
			}
			#share:disabled {
				opacity: 0.5;
				cursor: default;
			}
		</style>
	</head>
	<body>
		<h1 id="title">Share your screen</h1>
		<nav>
			<button type="button" id="screens" aria-pressed="true">Screens</button>
			<button type="button" id="windows" aria-pressed="false">Windows</button>
		</nav>
		<main id="list"></main>
		<footer>
			<button type="button" id="cancel">Cancel</button>
			<button type="button" id="share" disabled>Share</button>
		</footer>
		<script src="picker.js"></script>
	</body>
</html>
